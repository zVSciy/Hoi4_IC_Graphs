name: Bug report
description: Something does not work as expected.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Security problems belong in a
        [private report](https://github.com/zVSciy/Hoi4_IC_Graphs/security/advisories/new), not here.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
      placeholder: |
        1. Loaded output.txt as Data File 1
        2. Clicked "Factions IC (File 1)"
        3. The window stays empty
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: App version
      description: Shown in Settings → Updates (or the name of the downloaded file).
      placeholder: v3.2.0
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Windows version
      options:
        - Windows 11
        - Windows 10
    validations:
      required: true
  - type: input
    id: hoi4-version
    attributes:
      label: HOI4 and DataCollection version
      placeholder: HOI4 1.19.4, DataCollection 1.19.4
  - type: textarea
    id: log
    attributes:
      label: Log
      description: Main window → Show Log Viewer, then paste the relevant lines.
      render: text
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Screenshots, a zipped output.txt or a .hoi4game export that shows the problem.
