name: Release

# Builds the Windows package and publishes it as a GitHub release in this repository.
# Start it by pushing a version tag (git tag v3.2.0 && git push origin v3.2.0) or by
# hand from the Actions tab with a tag name.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create, e.g. v3.2.0 (created on the selected branch if it does not exist)"
        required: true
        type: string
      prerelease:
        description: "Mark as pre-release"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  EXE_NAME: HOI4_Analyzer.exe

jobs:
  checks:
    name: Checks
    uses: ./.github/workflows/ci.yml

  release:
    name: Build and publish
    needs: checks
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    env:
      # Baked into the binary so the app can tell when a newer release exists.
      HOI4_ANALYZER_RELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag
        run: |
          if ($env:TAG -notmatch '^v\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') {
            Write-Output "::error::Release tags look like v1.2.3 or v1.2.3-beta.1, got '$env:TAG'"
            exit 1
          }
          $crateVersion = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          if ($env:TAG.Substring(1) -ne $crateVersion) {
            Write-Output "::warning::Tag $env:TAG does not match version $crateVersion in Cargo.toml"
          }

      # Installs the toolchain pinned in rust-toolchain.toml.
      - name: Set up Rust
        run: |
          rustup toolchain install
          cargo --version

      - uses: Swatinem/rust-cache@v2

      # DataCollection/*.dll are compressed and embedded into the executable by build.rs.
      - name: Build executable
        run: cargo build --release --locked

      - name: Sign executable (self-signed)
        run: |
          $cert = New-SelfSignedCertificate -Subject "CN=zVSciy" -Type CodeSigning -KeyUsage DigitalSignature -FriendlyName "HOI4 Analyzer Code Signing" -CertStoreLocation Cert:\CurrentUser\My -NotAfter (Get-Date).AddYears(1)
          $result = Set-AuthenticodeSignature -FilePath "target/release/$env:EXE_NAME" -Certificate $cert -TimestampServer "http://timestamp.comodoca.com"
          if (-not $result.SignerCertificate) { throw "Signing failed: $($result.StatusMessage)" }
          Write-Output "Executable signed (status: $($result.Status))"

      - name: Package
        run: |
          New-Item -ItemType Directory -Force -Path dist, package | Out-Null
          Copy-Item "target/release/$env:EXE_NAME", README.md, LICENSE package/
          Compress-Archive -Path package/* -DestinationPath "dist/HOI4_Analyzer-$env:TAG-windows-x64.zip"

      - name: Checksums and release notes
        run: |
          $lines = Get-ChildItem dist | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name
          }
          $lines | Set-Content -Encoding ascii dist/SHA256SUMS.txt
          $lines
          $notes = @(
            "## Download"
            ""
            "**``HOI4_Analyzer-$env:TAG-windows-x64.zip``**: unzip it and run ``HOI4_Analyzer.exe`` (Windows 10/11, 64-bit)."
            ""
            "### SHA-256 checksums"
            ""
            '```'
            $lines
            '```'
          )
          $notes | Set-Content -Encoding utf8 release-notes.md

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: HOI4 IC Analyzer ${{ env.TAG }}
          body_path: release-notes.md
          generate_release_notes: true
          prerelease: ${{ inputs.prerelease || contains(env.TAG, '-') }}
          fail_on_unmatched_files: true
          files: dist/*
