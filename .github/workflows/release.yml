name: Release

# Builds Windows, Linux and macOS packages and publishes them as a GitHub release
# in this repository. Start it by pushing a version tag (git tag v3.2.0 && git push
# origin v3.2.0) or by hand from the Actions tab with a tag name.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create, e.g. v3.2.0 (created on the selected branch if it does not exist)"
        required: true
        type: string
      prerelease:
        description: "Mark as pre-release"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

defaults:
  run:
    shell: bash

jobs:
  checks:
    name: Checks
    uses: ./.github/workflows/ci.yml

  build:
    name: Build (${{ matrix.name }})
    needs: checks
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            targets: x86_64-pc-windows-msvc
          # The oldest supported Ubuntu sets the minimum glibc version of the Linux binary.
          - name: linux-x64
            os: ubuntu-24.04
            targets: x86_64-unknown-linux-gnu
          - name: macos-universal
            os: macos-latest
            targets: aarch64-apple-darwin x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    env:
      # Baked into the binary so the app can tell when a newer release exists.
      HOI4_ANALYZER_RELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release tags look like v1.2.3 or v1.2.3-beta.1, got '$TAG'"
            exit 1
          fi
          crate_version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          if [[ "${TAG#v}" != "$crate_version" ]]; then
            echo "::warning::Tag $TAG does not match version $crate_version in Cargo.toml"
          fi

      - name: Set up Rust
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.targets }}
          cargo --version

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}

      - name: Build
        run: |
          for target in ${{ matrix.targets }}; do
            cargo build --release --locked --target "$target"
          done

      - name: Sign executable (self-signed)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = "target/x86_64-pc-windows-msvc/release/HOI4_Analyzer.exe"
          $cert = New-SelfSignedCertificate -Subject "CN=zVSciy" -Type CodeSigning -KeyUsage DigitalSignature -FriendlyName "HOI4 Analyzer Code Signing" -CertStoreLocation Cert:\CurrentUser\My -NotAfter (Get-Date).AddYears(1)
          $result = Set-AuthenticodeSignature -FilePath $exe -Certificate $cert -TimestampServer "http://timestamp.comodoca.com"
          if (-not $result.SignerCertificate) { throw "Signing failed: $($result.StatusMessage)" }
          Write-Output "Executable signed (status: $($result.Status))"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist, package | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/HOI4_Analyzer.exe, README.md, LICENSE package/
          Compress-Archive -Path package/* -DestinationPath "dist/HOI4_Analyzer-$env:TAG-windows-x64.zip"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist "package/HOI4_Analyzer-$TAG"
          cp target/x86_64-unknown-linux-gnu/release/HOI4_Analyzer README.md LICENSE "package/HOI4_Analyzer-$TAG/"
          tar -C package -czf "dist/HOI4_Analyzer-$TAG-linux-x64.tar.gz" "HOI4_Analyzer-$TAG"

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          app="HOI4 Analyzer.app"
          mkdir -p dist "$app/Contents/MacOS" "$app/Contents/Resources"
          lipo -create -output "$app/Contents/MacOS/HOI4_Analyzer" \
            target/aarch64-apple-darwin/release/HOI4_Analyzer \
            target/x86_64-apple-darwin/release/HOI4_Analyzer
          lipo -info "$app/Contents/MacOS/HOI4_Analyzer"

          # App icon: ICO -> PNG -> ICNS. A missing icon must not fail the release.
          make_icon() {
            sips -s format png assets/cover.thumb256.ico --out icon.png >/dev/null
            mkdir -p icon.iconset
            for size in 16 32 128 256; do
              sips -z "$size" "$size" icon.png --out "icon.iconset/icon_${size}x${size}.png" >/dev/null
              if [ $((size * 2)) -le 256 ]; then
                sips -z $((size * 2)) $((size * 2)) icon.png --out "icon.iconset/icon_${size}x${size}@2x.png" >/dev/null
              fi
            done
            iconutil -c icns icon.iconset -o "$app/Contents/Resources/AppIcon.icns"
          }
          if ! make_icon; then
            echo "::warning::Could not convert the app icon; the bundle uses the default icon"
          fi

          version="${TAG#v}"
          cat > "$app/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>HOI4 Analyzer</string>
            <key>CFBundleDisplayName</key><string>HOI4 IC Analyzer</string>
            <key>CFBundleIdentifier</key><string>io.github.zvsciy.hoi4analyzer</string>
            <key>CFBundleExecutable</key><string>HOI4_Analyzer</string>
            <key>CFBundleIconFile</key><string>AppIcon</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${version}</string>
            <key>CFBundleVersion</key><string>${version}</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          EOF
          plutil -lint "$app/Contents/Info.plist"

          cp LICENSE README.md "$app/Contents/Resources/"
          # Ad-hoc signature so the universal binary runs on Apple Silicon (not notarized).
          codesign --force --deep --sign - "$app"
          codesign --verify --verbose "$app"
          ditto -c -k --keepParent "$app" "dist/HOI4_Analyzer-$TAG-macos-universal.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: dist
          merge-multiple: true

      - name: Checksums and release notes
        run: |
          cd dist
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          {
            echo "## Downloads"
            echo
            echo "| Platform | File |"
            echo "| --- | --- |"
            echo "| Windows 10/11 (64-bit) | \`HOI4_Analyzer-$TAG-windows-x64.zip\` |"
            echo "| Linux (x86-64) | \`HOI4_Analyzer-$TAG-linux-x64.tar.gz\` |"
            echo "| macOS 11+ (Apple Silicon and Intel) | \`HOI4_Analyzer-$TAG-macos-universal.zip\` |"
            echo
            echo "Data collection from a running game needs Windows; Linux and macOS analyse recorded files."
            echo "The macOS app is not notarized: right-click it and choose **Open** the first time."
            echo
            echo "### SHA-256 checksums"
            echo
            echo '```'
            cat SHA256SUMS.txt
            echo '```'
          } > ../release-notes.md

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: HOI4 IC Analyzer ${{ env.TAG }}
          body_path: release-notes.md
          generate_release_notes: true
          prerelease: ${{ inputs.prerelease || contains(env.TAG, '-') }}
          fail_on_unmatched_files: true
          files: dist/*
