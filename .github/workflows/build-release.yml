name: Build and Release HOI4 Analyzer

on:
  workflow_dispatch:
    inputs:
      version_string:
        description: 'Version string for the release'
        required: true
        type: string
        default: 'v1.0.X'
      release_type:
        description: 'Type of release (e.g., 1.16.5, 1.17.0, etc.)'
        required: true
        default: 'latest Hoi4 version'

env:
  CARGO_TERM_COLOR: always
  EXE_NAME: HOI4_Analyzer.exe
  PACKAGE_NAME: HOI4_Analyzer_Rust_${{ github.event.inputs.version_string }}

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Installs the toolchain pinned in rust-toolchain.toml.
      - name: Set up Rust
        run: |
          rustup toolchain install
          rustup show active-toolchain
          cargo --version
        shell: pwsh

      - name: Cache cargo registry and build output
        uses: Swatinem/rust-cache@v2

      - name: Check formatting and lints
        run: |
          cargo fmt --check
          cargo clippy --release --locked --all-targets -- -D warnings
        shell: pwsh

      - name: Run tests
        run: cargo test --release --locked
        shell: pwsh

      # DataCollection/*.dll are compressed and embedded into the executable by build.rs.
      # The release tag is baked in so the app can tell when a newer release exists.
      - name: Build executable
        run: cargo build --release --locked
        shell: pwsh
        env:
          HOI4_ANALYZER_RELEASE: ${{ github.event.inputs.version_string }}

      - name: Sign executable (self-signed)
        run: |
          $cert = New-SelfSignedCertificate -Subject "CN=zVSciy" -Type CodeSigning -KeyUsage DigitalSignature -FriendlyName "HOI4 Analyzer Code Signing" -CertStoreLocation Cert:\CurrentUser\My -NotAfter (Get-Date).AddYears(1)
          $result = Set-AuthenticodeSignature -FilePath "target/release/${{ env.EXE_NAME }}" -Certificate $cert -TimestampServer "http://timestamp.comodoca.com"
          if (-not $result.SignerCertificate) { throw "Signing failed: $($result.StatusMessage)" }
          echo "Executable signed (status: $($result.Status))"
        shell: pwsh

      - name: Create release package
        run: |
          New-Item -ItemType Directory -Force -Path "release"
          Copy-Item "target/release/${{ env.EXE_NAME }}" "release/"
          Copy-Item "README.md" "release/"
          Compress-Archive -Path "release/*" -DestinationPath "${{ env.PACKAGE_NAME }}.zip"
        shell: pwsh

      - name: Calculate SHA256 hashes
        run: |
          $exeHash = Get-FileHash -Path "target/release/${{ env.EXE_NAME }}" -Algorithm SHA256
          $zipHash = Get-FileHash -Path "${{ env.PACKAGE_NAME }}.zip" -Algorithm SHA256

          echo "EXECUTABLE_HASH=$($exeHash.Hash)" >> $env:GITHUB_ENV
          echo "ZIP_HASH=$($zipHash.Hash)" >> $env:GITHUB_ENV
        shell: pwsh

      - name: Create Public Release and Upload Build Artifacts
        uses: softprops/action-gh-release@v2
        with:
          repository: zVSciy/Hoi4GraphToolReleases
          token: ${{ secrets.PUBLIC_RELEASE_TOKEN }}
          files: |
            ${{ env.PACKAGE_NAME }}.zip
          tag_name: ${{ github.event.inputs.version_string }}
          name: "HOI4 IC Analyzer (Rust) Release ${{ github.event.inputs.version_string }}"
          body: |
            **HOI4 IC Analyzer (Rust Version) - Version:** `${{ github.event.inputs.version_string }}`

            **Release Type:** `${{ github.event.inputs.release_type }}`

            **SHA256 Hash:**
            - Release Package: `${{ env.ZIP_HASH }}`
            - Executable: `${{ env.EXECUTABLE_HASH }}`

            **Build Information:**
            - Triggered by: ${{ github.actor }}
            - Commit of private repo: ${{ github.sha }}
          draft: false
          prerelease: false
